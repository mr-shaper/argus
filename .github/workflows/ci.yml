name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff requests

      - name: Syntax check (py_compile)
        run: |
          python -m py_compile scripts/probe.py
          python -m py_compile scripts/github_fetch.py
          python -m py_compile scripts/nlm_pipeline.py
          python -m py_compile scripts/perplexity_quick.py
          python -m py_compile scripts/perplexity_deep.py
          python -m py_compile scripts/bird_batch.py
          python -m py_compile scripts/webaccess_crawl.py
          python -m py_compile scripts/tool_auth_check.py

      - name: Ruff lint
        run: ruff check scripts/ --select E,F,W --ignore E501
        continue-on-error: true

  pii-check:
    name: PII / Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded secrets or PII
        run: |
          # Fail if any literal tokens/cookies are found in tracked files
          if grep -rniE '(bearer [a-z0-9]{20,}|api.key\s*=\s*"[^"]{10,}"|password\s*=\s*"[^"]+")' \
               scripts/ references/ --include="*.py" --include="*.md"; then
            echo "ERROR: Possible hardcoded secret found. Remove before merging."
            exit 1
          fi
          echo "PII check passed."
